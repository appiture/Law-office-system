# Server
server.port=${SERVER_PORT:8080}

# Database (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:lawoffice;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# SQL Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Mail (Mock/Empty for demo)
spring.mail.host=localhost
spring.mail.port=25
mail.from=demo@lawoffice.com

# JWT (Not used but placeholders to avoid errors)
jwt.secret=secretsecretsecretsecretsecretsecretsecret
jwt.expiration=86400000

# Cloudinary (Mock/Empty for demo)
cloudinary.cloud-name=demo
cloudinary.api-key=demo
cloudinary.api-secret=demo

# Logging
logging.level.root=INFO
logging.level.com.lawoffice.backend=INFO

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
