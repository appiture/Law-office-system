# Server
server.port=${SERVER_PORT:8080}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:lawoffice;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.sql.init.mode=never

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.audit.fallback-email=system@lawoffice.local
app.demo.email=demo@lawoffice.local
app.demo.password=demo123

# JWT
jwt.secret=secretsecretsecretsecretsecretsecretsecret
jwt.expiration=86400000

# Cloudinary (Mock/Empty for demo)
cloudinary.cloud-name=demo
cloudinary.api-key=demo
cloudinary.api-secret=demo

# Logging
logging.level.root=INFO
logging.level.com.lawoffice.backend=INFO

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Dev Mode
app.dev.mode=${APP_DEV_MODE:false}
